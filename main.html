  يعتمد على: config.js (الاتصال، التصنيفات، قواعد التنبيهات) + app.js (الكود، مولَّد من src/app.jsx) + supabase/schema.sql

  الصفحات:
    1) المشتكي (الرابط الأساسي): خانة كلمة المرور أولاً (عامة أو خاصة حسب إعداد الأدمن)، وتحتها
       زر «تقديم شكوى مباشرة» إن فعّله الأدمن ← الاسم وصفته، الهاتف، واتس/تلغرام، المشتكى عليه وصفته، عنوان الاعتراض، نص الاعتراض
       ← «تم تسجيل الشكوى بنجاح» مع رقم الشكوى ورمز المتابعة.
    2) نتيجة الشكوى (‎#/result): الشكاوى المحفوظة على الجهاز تلقائياً، أو بالرقم + رمز المتابعة
       ← الحالة والنتيجة وتاريخ الإغلاق فقط.
    2ب) الاعتراض (‎#/objection): المشتكى عليه برقم الشكوى + رمز الاعتراض ← الملخص فقط ← اعتراض واحد.
    3) الأدمن (‎#/admin): «المطلوب» (تنبيهات ذكية) وجدول الشكاوى (اختيار عدة صفوف وتغييرها معاً،
       وتصدير Excel)، «الروابط» (رسائل جاهزة للنسخ)، إعدادات دخول المشتكين، وكلمات مرور الإدارة، و«الإعدادات» (التصفير).
    4) التقارير (‎#/reports): بكلمة مرور الإدارة — أعداد الشكاوى خلال فترة وجدول بحالاتها.

  ملاحظات:
    - رقم الشكوى: الموسم-الرقم (1448-00001)؛ الموسم الحالي يُحدَّد من تبويب «الإعدادات».
    - الحالات: جديد / قيد المراجعة / جاري المتابعة / مغلقة (تُستخدم أسماء لاتينية للألوان: new/review/follow/closed).
    - الموقع لا يقرأ الجداول مباشرة؛ كل العمليات عبر دوال Supabase تتحقق من المدخلات داخلها.
    - كلمتا الأدمن والإدارة تُحفظان في sessionStorage (وفي localStorage إن اختير «تذكّرني»)؛ شكاوى المشتكي (الرقم + الرمز) في localStorage.
    - قاعدة معتمدة: تصميم ثابت على الجوال (لا تمرير أفقي للصفحة؛ الجداول داخل إطار قابل للتمرير).

<style>
  /* متغيرات الألوان والأبعاد الموحدة للمنصة */
  :root {
    /* لوحة الألوان المعتمدة (هوية إدارة الحج والعمرة) */
    --bg: #f5f1ea;          /* خلفية الصفحة: درجة فاتحة من #e3ddd2 */
    --card: #ffffff;
    --ink: #333132;         /* النصوص */
    --muted: #939598;       /* النصوص الثانوية */
    --line: #e3ddd2;        /* الحدود */
    --brand: #006e5c;       /* العناوين والأزرار الرئيسية */
    --brand-dark: #00594f;  /* الشريط العلوي والعناوين الداكنة */
    --brand-light: #279e91; /* لمسات فاتحة */
    --brand-soft: #e4f2ef;  /* خلفية فاتحة من #279e91 */
    --gold: #ad9e6e;        /* العناصر والرموز */
    --gold-light: #d9c89e;
    --sand: #e3ddd2;
    --danger: #b42318;
    --danger-soft: #fdecea;
    --ok: #006e5c;
    --ok-soft: #e4f2ef;
    --radius: 12px;
    --shadow: 0 1px 2px rgba(51, 49, 50, .06), 0 4px 16px rgba(51, 49, 50, .05);
  }

  /* إعدادات أساسية: الخط، الخلفية، وتثبيت حجم النص على الجوال عند تدوير الشاشة */
  * { box-sizing: border-box; }
  html { -webkit-text-size-adjust: 100%; text-size-adjust: 100%; }
  body {
    margin: 0; background: var(--bg); color: var(--ink); overflow-x: hidden;
    font-family: "Tajawal", "Segoe UI", Tahoma, sans-serif; font-size: 15px; line-height: 1.6;
  }
  a { color: var(--brand); }
  button, input, select, textarea { font: inherit; color: inherit; }

  /* الشريط العلوي: الشعار واسم الصفحة وزر الخروج (مع مراعاة حافة الشاشة في الجوال) */
  .topbar { background: var(--brand-dark); color: #fff; padding-top: env(safe-area-inset-top, 0px); }
  .topbar-inner { max-width: 1200px; margin: 0 auto; padding: 12px 16px; display: flex; align-items: center; justify-content: space-between; gap: 12px; }
  .brand { display: flex; align-items: center; gap: 10px; font-weight: 800; font-size: 17px; color: #fff; min-width: 0; text-decoration: none; }
  .brand small { font-weight: 500; opacity: .75; font-size: 14px; }
  .brand-mark { width: 34px; height: 34px; border-radius: 9px; background: var(--gold); display: grid; place-items: center; font-size: 18px; flex: none; }

  /* الحاوية الرئيسية */
  .container { max-width: 1200px; margin: 0 auto; padding: 24px 16px; padding-bottom: calc(48px + env(safe-area-inset-bottom, 0px)); }
  .narrow { max-width: 480px; margin: 0 auto; }

  /* رأس الصفحة: العنوان والوصف */
  .page-head { margin-bottom: 16px; }
  .page-head h1 { margin: 0; font-size: 22px; font-weight: 800; }
  .page-head p { margin: 4px 0 0; color: var(--muted); }

  /* البطاقات البيضاء */
  .card { background: var(--card); border: 1px solid var(--line); border-radius: var(--radius); box-shadow: var(--shadow); padding: 20px; }
  .card + .card { margin-top: 14px; }
  .card h2 { margin: 0 0 12px; font-size: 17px; }

  /* حقول النماذج؛ خط 16px يمنع التكبير التلقائي في iPhone */
  .grid { display: grid; gap: 12px 16px; grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); }
  .field { display: flex; flex-direction: column; gap: 6px; min-width: 0; }
  .field.full { grid-column: 1 / -1; }
  .field-label { font-weight: 600; font-size: 14px; }
  .req { color: var(--danger); margin-inline-start: 3px; }
  .hint { color: var(--muted); font-size: 12.5px; }
  input, select, textarea {
    width: 100%; padding: 10px 12px; border: 1px solid #d8d0c0; border-radius: 9px; background: #fff;
    outline: none; font-size: 16px; transition: border-color .15s, box-shadow .15s;
  }
  input[type=checkbox] { width: 18px; height: 18px; padding: 0; accent-color: var(--brand); cursor: pointer; }
  input:focus, select:focus, textarea:focus { border-color: var(--brand); box-shadow: 0 0 0 3px rgba(0,110,92,.18); }
  textarea { min-height: 110px; resize: vertical; }
  /* خانة الرمز: كبيرة ومتباعدة في المنتصف */
  input.code-input { text-align: center; font-size: 24px; letter-spacing: 6px; font-weight: 700; direction: ltr; }
  /* خانة كلمة المرور المخفية: في المنتصف مع زر إظهار/إخفاء */
  input.secret-input { text-align: center; font-size: 20px; letter-spacing: 2px; direction: ltr; padding-inline: 48px; }
  /* أحرف مخفية في حقل نصي (رمز التصفير): لا يعرض المتصفح حفظه كما يفعل مع حقل كلمة المرور */
  input.masked { -webkit-text-security: disc; text-security: disc; }
  .pw-wrap { position: relative; }
  .pw-toggle { position: absolute; top: 50%; transform: translateY(-50%); inset-inline-start: 6px; width: 38px; height: 38px; border: 0; background: transparent; cursor: pointer; font-size: 20px; border-radius: 8px; }
  .pw-toggle:hover { background: #f2eee6; }

  /* الأزرار */
  .btn { display: inline-flex; align-items: center; justify-content: center; gap: 6px; min-height: 44px; border: 1px solid transparent; border-radius: 10px; padding: 9px 16px; font-weight: 700; font-size: 15px; cursor: pointer; background: var(--brand); color: #fff; text-decoration: none; white-space: nowrap; }
  .btn:hover { background: var(--brand-dark); }
  .btn:disabled { opacity: .55; cursor: not-allowed; }
  .btn.gold { background: var(--gold); }
  .btn.secondary { background: #fff; color: var(--ink); border-color: #d8d0c0; }
  .btn.secondary:hover { background: #f5f1ea; }
  .btn.danger-text { background: none; color: var(--danger); border: 0; min-height: 0; padding: 4px 6px; }
  .btn.sm { min-height: 36px; padding: 6px 12px; font-size: 14px; }
  .btn.ghost { min-height: 34px; padding: 4px 12px; font-size: 14px; background: transparent; border-color: rgba(255,255,255,.3); color: #e4f2ef; }
  .btn.block { width: 100%; }
  .row { display: flex; gap: 10px; flex-wrap: wrap; align-items: center; }
  /* في الصف: الخانة تأخذ الباقي، والزر بجانبها يبقى بحجمه كاملاً (كان «مسح» ينضغط إلى حرف «م») */
  .row > input:not([type=checkbox]):not([type=radio]), .row > select { flex: 1 1 0; min-width: 0; }
  .row > .btn { flex-shrink: 0; }
  .row > .grow { flex: 1 1 180px; }

  /* رسائل التنبيه */
  .alert { padding: 11px 14px; border-radius: 9px; margin-bottom: 14px; font-weight: 500; }
  .alert.error { background: var(--danger-soft); color: var(--danger); }
  .alert.ok { background: var(--ok-soft); color: var(--ok); }
  .alert.info { background: #eaf2fd; color: #1d5fbf; }

  /* ألوان الحالات: جديد برتقالي، قيد المراجعة أزرق، جاري المتابعة بنفسجي، مغلقة أخضر
     (--st لون الحالة الأساسي، --st-soft خلفيته الفاتحة) */
  .st-new { --st: #c2610c; --st-soft: #fff4e6; }
  .st-review { --st: #1d5fbf; --st-soft: #eaf2fd; }
  .st-follow { --st: #7a3fb8; --st-soft: #f3ecfb; }
  .st-objreview { --st: #b8336a; --st-soft: #fcebf2; }   /* قيد مراجعة الاعتراض: وردي داكن */
  .st-objfollow { --st: #8a6d1f; --st-soft: #f7f0dc; }   /* جاري متابعة الاعتراض: ذهبي داكن */
  .st-closed { --st: #006e5c; --st-soft: #e4f2ef; }
  .st-closedobj { --st: #00594f; --st-soft: #d4ece8; }  /* مغلقة بعد الاعتراض: أخضر أغمق */

  /* شارة الحالة بلونها */
  .badge { display: inline-block; padding: 2px 10px; border-radius: 999px; font-size: 13px; font-weight: 700; white-space: nowrap; background: var(--st-soft, #eee9df); color: var(--st, #555556); border: 1px solid var(--st, transparent); }

  /* بطاقة الشكوى (في نافذة التفاصيل) بلون حالتها: شريط جانبي وخلفية فاتحة */
  .card.status-card { border-inline-start: 6px solid var(--st); background: linear-gradient(to left, var(--st-soft), #fff 70%); }
  .card.status-card .c-no { color: var(--st); }

  /* صف جدول بلون حالته */
  table tr.status-row td:first-child { border-inline-start: 5px solid var(--st); }
  table tr.status-row { background: var(--st-soft); }

  /* صفحات الدخول: الشعار الكبير والعنوان */
  .hero { text-align: center; margin: 8px 0 18px; }
  .hero .brand-mark { width: 64px; height: 64px; font-size: 34px; border-radius: 16px; margin: 0 auto 10px; }
  .hero h1 { margin: 0; font-size: 22px; font-weight: 800; }
  .hero p { margin: 4px 0 0; color: var(--muted); }
  .below-link { text-align: center; margin-top: 16px; }

  /* رسالة النجاح ورقم الشكوى ورمز المتابعة */
  .done { text-align: center; padding: 30px 20px; }
  .done .icon { font-size: 56px; line-height: 1; }
  .done h2 { margin: 14px 0 6px; font-size: 22px; color: var(--ok); }
  .ticket { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin: 18px 0 8px; }
  .ticket div { background: #eef7f5; border: 2px dashed #a9d6cf; border-radius: 12px; padding: 10px 6px; }
  .ticket small { display: block; color: var(--muted); font-weight: 600; }
  .ticket b { display: block; font-size: 22px; letter-spacing: 2px; direction: ltr; color: var(--brand-dark); }

  /* التبويبات وأزرار التصفية (قابلة للتمرير أفقياً على الجوال) */
  .tabs { display: flex; gap: 4px; background: #ebe6dc; border-radius: 11px; padding: 4px; margin-bottom: 16px; overflow-x: auto; scrollbar-width: none; }
  .tabs::-webkit-scrollbar { display: none; }
  .tabs button { flex: 1 0 auto; border: 0; background: transparent; padding: 8px 14px; border-radius: 8px; cursor: pointer; font-weight: 700; color: var(--muted); white-space: nowrap; }
  .tabs button.active { background: #fff; color: var(--ink); box-shadow: var(--shadow); }
  .tab-count { display: inline-block; min-width: 22px; padding: 0 6px; margin-inline-start: 6px; border-radius: 999px; background: #c0262d; color: #fff; font-size: 12.5px; line-height: 20px; }
  .chips { display: flex; gap: 6px; overflow-x: auto; scrollbar-width: none; margin-bottom: 12px; }
  .chips::-webkit-scrollbar { display: none; }
  .chips button { border: 1px solid var(--line); background: #fff; padding: 5px 12px; border-radius: 999px; cursor: pointer; font-weight: 600; white-space: nowrap; font-size: 14px; }
  .chips button.active { background: var(--brand); border-color: var(--brand); color: #fff; }

  /* جدول الشكاوى (مثل Excel): إطار قابل للتمرير، رأس ثابت، صفوف قابلة للاختيار */
  .table-wrap { overflow: auto; max-height: 72vh; border-radius: var(--radius); }
  table { width: 100%; border-collapse: collapse; font-size: 14px; }
  th, td { padding: 9px 10px; text-align: start; border-bottom: 1px solid var(--line); vertical-align: top; }
  th { color: var(--muted); font-weight: 700; font-size: 13px; background: #faf8f4; white-space: nowrap; position: sticky; top: 0; z-index: 1; }
  table.sheet td { white-space: nowrap; }
  table.sheet td.wrap { white-space: normal; min-width: 220px; max-width: 320px; overflow-wrap: anywhere; }
  table.sheet tbody tr { cursor: pointer; }
  table.sheet tbody tr:hover td { filter: brightness(.97); }
  table.sheet tr.selected td { background: #fff3c4 !important; }
  table.sheet td.chk, table.sheet th.chk { width: 36px; text-align: center; }
  .clip { display: -webkit-box; -webkit-line-clamp: 2; line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }
  td.subj { max-width: 320px; overflow-wrap: anywhere; }

  /* عناوين قابلة للفرز: السهم ▲ تصاعدي، ▼ تنازلي، ⇅ بلا فرز */
  th.sortable { cursor: pointer; user-select: none; }
  th.sortable:hover { color: var(--ink); background: #eef4f2; }
  .sort-arrow { font-size: 11px; color: var(--brand); margin-inline-start: 2px; }
  .sort-arrow.off { color: #c4bba6; }
  table.sheet th { font-size: .9em; }

  /* شريط أدوات الجدول: عدد الأسطر، الأعمدة، حجم الخط، التصدير */
  .table-tools { display: flex; flex-wrap: wrap; gap: 10px; align-items: center; margin-bottom: 10px; }
  .table-tools .tool { display: flex; align-items: center; gap: 6px; font-size: 14px; font-weight: 600; color: var(--muted); }
  .table-tools select { width: auto; min-height: 36px; padding: 5px 10px; }
  .table-tools .tool-end { margin-inline-start: auto; }
  .font-tools { gap: 4px !important; }
  .font-tools .btn { min-width: 40px; }
  .cols-menu { position: relative; }
  .menu-back { position: fixed; inset: 0; z-index: 20; }
  .menu { position: absolute; top: calc(100% + 6px); inset-inline-start: 0; z-index: 21; background: #fff; border: 1px solid var(--line); border-radius: 10px; box-shadow: 0 8px 24px rgba(0,0,0,.14); padding: 8px; min-width: 200px; max-height: 60vh; overflow-y: auto; }
  .menu label { display: flex; align-items: center; gap: 8px; padding: 6px 8px; border-radius: 6px; cursor: pointer; color: var(--ink); font-weight: 500; }
  .menu label:hover { background: #f5f1ea; }
  .pager { display: flex; justify-content: space-between; align-items: center; flex-wrap: wrap; gap: 8px; margin-top: 10px; font-size: 14px; }

  /* شريط التغيير الجماعي: يظهر عند اختيار صف أو أكثر */
  .bulk-bar { background: var(--brand-dark); color: #fff; border-radius: var(--radius); padding: 12px; margin-bottom: 12px; display: flex; gap: 8px; flex-wrap: wrap; align-items: center; }
  .bulk-bar b { white-space: nowrap; }
  .bulk-bar select, .bulk-bar input { width: auto; flex: 1 1 150px; min-height: 40px; padding: 7px 10px; color: var(--ink); background: #fff; }
  .bulk-bar .btn.secondary { background: transparent; color: #fff; border-color: rgba(255,255,255,.4); }

  /* أشرطة التنبيهات: عاجل أحمر، متابعة برتقالي، تذكير أزرق، مجدول رمادي */
  .reminder-bar { border-radius: 9px; padding: 7px 12px; margin: 4px 0 10px; font-weight: 700; font-size: 14px; }
  .reminder-bar.danger { background: #c0262d; color: #fff; }
  .reminder-bar.warn { background: #fff4e6; color: #c2610c; border: 1px solid #f3c99a; }
  .reminder-bar.info { background: #eaf2fd; color: #1d5fbf; }
  .reminder-bar.later { background: #f2eee6; color: #6b6c6e; font-weight: 500; }
  .alert-tag { display: block; font-size: 12.5px; font-weight: 700; border-radius: 6px; padding: 1px 8px; margin-bottom: 3px; white-space: normal; }
  .alert-tag.danger { background: #c0262d; color: #fff; }
  .alert-tag.warn { background: #ffe6cc; color: #a24f06; }
  .alert-tag.info { background: #d9e8fc; color: #1d5fbf; }
  .alert-tag.later { background: #ece7dd; color: #6b6c6e; }
  .alert-chip { padding: 4px 12px; border-radius: 999px; font-weight: 700; font-size: 14px; }
  .alert-chip.danger { background: #fdecec; color: #c0262d; }
  .alert-chip.warn { background: #fff4e6; color: #c2610c; }
  .alert-chip.info { background: #eaf2fd; color: #1d5fbf; }
  .alert-chip.later { background: #f2eee6; color: #6b6c6e; }

  /* نافذة تفاصيل الشكوى (فوق الصفحة) */
  .modal-back { position: fixed; inset: 0; background: rgba(15, 25, 20, .5); z-index: 80; overflow-y: auto; overscroll-behavior: contain; padding: 24px 12px; -webkit-overflow-scrolling: touch; }
  .modal { max-width: 760px; margin: 0 auto; }
  .modal-close { display: flex; justify-content: flex-end; margin-bottom: 8px; position: sticky; top: -24px; z-index: 5; padding: 8px 0; }
  .c-head { display: flex; justify-content: space-between; align-items: flex-start; gap: 10px; margin-bottom: 8px; }
  .c-no { font-weight: 800; direction: ltr; }
  .meta { color: var(--muted); font-size: 13.5px; display: flex; gap: 4px 14px; flex-wrap: wrap; }
  .subject { background: #f9f7f2; border-radius: 9px; padding: 10px 12px; margin: 10px 0 14px; white-space: pre-wrap; overflow-wrap: anywhere; }

  /* قسم الجلسات داخل تفاصيل الشكوى: فاصل منقّط، وجدول صغير، ونموذج جلسة جديدة */
  .sessions { margin-top: 20px; padding-top: 16px; border-top: 2px dashed var(--line); }
  .sessions h3 { margin: 0 0 10px; font-size: 16px; }
  .session-form { background: rgba(255,255,255,.7); border: 1px solid var(--line); border-radius: 10px; padding: 12px; }

  /* بطاقة التقارير (للاطلاع فقط): صفوف قابلة للضغط، شارة القراءة، وشبكة البيانات */
  table.stack tr.clickable { cursor: pointer; }
  table.stack tr.clickable:hover td { filter: brightness(.97); }
  .readonly-tag { background: #eee9df; color: #555556; border-radius: 999px; padding: 0 8px; font-weight: 700; }
  .detail-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(170px, 1fr)); gap: 10px 18px; margin: 10px 0 14px; }
  .detail-grid dt { color: var(--muted); font-size: 13px; }
  .detail-grid dd { margin: 2px 0 0; font-weight: 700; overflow-wrap: anywhere; }

  /* الشعار واسم الجهة في الشريط العلوي وصفحات الدخول */
  .logo { object-fit: contain; flex: none; }
  .hero .logo, .hero .brand-mark { display: block; margin: 0 auto 8px; }
  .hero-org { color: var(--gold); font-weight: 800; font-size: 14px; margin-bottom: 2px; }
  .brand-text { display: flex; flex-direction: column; line-height: 1.25; min-width: 0; }
  .brand-text b { font-size: 16px; }
  .brand-text small { font-weight: 500; opacity: .8; font-size: 12.5px; }

  /* «تذكّرني» وخانة اسم الحساب المخفية بصرياً */
  .keep-row { display: flex; align-items: center; gap: 8px; margin-top: 12px; font-size: 14px; color: var(--muted); cursor: pointer; }
  .sr-only { position: absolute; width: 1px; height: 1px; padding: 0; margin: -1px; overflow: hidden; clip: rect(0 0 0 0); border: 0; }

  /* النص الجاري التقاطه من الميكروفون (قبل تثبيته) */
  .interim { margin-top: 6px; padding: 6px 10px; border-radius: 8px; background: #fff4e6; color: #a24f06; font-size: 14px; }

  /* قسم التصفير: إطار أحمر تحذيري */
  .danger-zone { border: 2px solid #f1b5b0; background: #fff8f7; }
  .danger-zone h2 { color: var(--danger); }

  /* نافذة استعراض نسخة Excel: أعرض من النافذة العادية، والجدول يتمرر داخل إطاره */
  .xl-modal { max-width: 1100px; background: var(--card); border-radius: var(--radius); box-shadow: var(--shadow); padding: 16px; }
  .xl-view { max-height: 60vh; }
  .xl-view th { position: sticky; top: 0; background: #eaf3f1; z-index: 1; }
  .xl-view td { max-width: 320px; white-space: pre-wrap; vertical-align: top; }
  .xl-view tr.clickable { cursor: pointer; }
  .xl-view tr.clickable:hover td { background: #eef7f5; }
  /* أدوات الاستعراض (بحث، تصفية، عدد الأسطر، الأعمدة) وقائمة اختيار الأعمدة */
  .xl-tools { display: grid; gap: 8px; margin-bottom: 10px; }
  .col-picker { display: grid; grid-template-columns: repeat(auto-fill, minmax(160px, 1fr)); gap: 4px 12px; padding: 10px; border: 1px solid var(--line); border-radius: 10px; background: #faf8f4; }
  .col-picker label { display: flex; align-items: center; gap: 6px; font-size: 14px; cursor: pointer; }
  .xl-card dd { white-space: pre-wrap; }

  /* الصفة تحت الاسم في الجداول */
  .role-tag { display: block; font-size: 12px; color: var(--muted); font-weight: 400; }

  /* عناصر قائمة في الإعدادات (التصنيفات / الصفات) */
  .list-items { list-style: none; margin: 12px 0 0; padding: 0; }
  .list-items li { display: flex; justify-content: space-between; align-items: center; gap: 8px; padding: 6px 10px; border: 1px solid var(--line); border-radius: 9px; margin-bottom: 6px; background: #faf8f4; }

  /* خطوات نموذج الشكوى: دوائر مرقّمة (الحالية خضراء، المكتملة ✓) وخط يصل بينها */
  .steps { display: flex; list-style: none; margin: 0 0 14px; padding: 0; }
  .steps li { flex: 1; display: flex; flex-direction: column; align-items: center; gap: 4px; position: relative; color: var(--muted); font-size: 13.5px; font-weight: 700; }
  .steps li + li::before { content: ""; position: absolute; top: 16px; inset-inline-end: 50%; width: 100%; height: 3px; background: #e3ddd2; z-index: 0; }
  .steps li.s-done + li::before, .steps li.s-now::before { background: var(--brand); }
  .step-dot { position: relative; z-index: 1; width: 34px; height: 34px; border-radius: 50%; display: grid; place-items: center; background: #ebe6dc; color: var(--muted); font-size: 16px; }
  .steps li.s-now { color: var(--ink); }
  .steps li.s-now .step-dot { background: var(--brand); color: #fff; box-shadow: 0 0 0 4px #cfe9e4; }
  .steps li.s-done .step-dot { background: #d4ece8; color: #00594f; }
  .step-buttons { display: flex; gap: 10px; margin-top: 18px; }
  .step-buttons .btn { flex: 1; min-height: 50px; font-size: 17px; }

  /* حقل للعرض فقط (الحالة)، ومربع نتيجة الشكوى، وعلامة «بعد الاعتراض»، وملاحظة القفل */
  .readonly-field { min-height: 44px; display: flex; align-items: center; gap: 6px; flex-wrap: wrap; padding: 6px 10px; border: 1px dashed var(--line); border-radius: 9px; background: #faf8f4; }
  .result-box { margin-top: 12px; }
  .obj-tag { display: inline-block; margin-inline-start: 6px; padding: 0 8px; border-radius: 999px; background: #fcebf2; color: #b8336a; font-size: 12.5px; font-weight: 800; }
  .locked-note { margin-top: 14px; padding: 10px 12px; border-radius: 10px; background: #eee9df; color: var(--ink); font-weight: 700; text-align: center; }

  /* المواسم السابقة: بطاقات روابط Google Sheets، وخطوات الإعداد، وشريط الروابط في التقارير */
  .past-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(190px, 1fr)); gap: 14px; }
  .past-card { display: flex; flex-direction: column; gap: 4px; padding: 18px; border-radius: 16px; background: var(--card); border: 1px solid var(--line);
               box-shadow: var(--shadow); text-decoration: none; color: var(--ink); border-top: 4px solid var(--brand-light); }
  .past-card:hover { border-color: var(--brand-light); }
  .past-card b { font-size: 18px; color: var(--brand-dark); }
  .past-card small { color: var(--muted); }
  .past-icon { font-size: 28px; }
  .past-steps { margin: 0 0 12px; padding-inline-start: 20px; line-height: 2; font-size: 14px; }
  .past-strip { display: flex; flex-wrap: wrap; align-items: center; gap: 8px; margin-bottom: 12px; }
  /* بطاقة الموسم كزر (تفتح الملف داخل المنصة)، وعناوين أقسام بطاقة «أرشفة المواسم» */
  button.past-card { font: inherit; text-align: start; cursor: pointer; width: 100%; }
  /* الروابط المرفقة: خانتا الإدخال (عمودان، وعمود واحد على الجوال) وأزرار «🔗 رابط» */
  .links-inputs { display: grid; grid-template-columns: repeat(auto-fit, minmax(min(100%, 220px), 1fr)); gap: 8px; }
  .links-view { display: inline-flex; flex-wrap: wrap; gap: 6px; }
  .link-chip { display: inline-block; padding: 2px 10px; border-radius: 999px; background: #e6f2ef; color: var(--brand-dark); font-size: 13px; font-weight: 700; text-decoration: none; white-space: nowrap; }
  .link-chip:hover { background: #d3e9e4; }
  /* شارة نوع الطلب: اعتراض على قرار إداري (ذهبية، بجانب الرقم) */
  .kind-badge { display: inline-block; padding: 1px 8px; border-radius: 999px; background: #f1ead7; color: #6b5d2f; border: 1px solid #d9c89e;
                font-size: 12px; font-weight: 700; white-space: nowrap; vertical-align: middle; }
  .links-line { display: flex; flex-wrap: wrap; align-items: center; gap: 8px; margin: 8px 0; }
  .links-edit { margin: 8px 0; padding: 10px; border: 1px dashed var(--line); border-radius: 10px; }
  /* «إعداد لمرة واحدة» في أرشفة المواسم: مربع قابل للفتح */
  .setup-box { margin: 0 0 12px; padding: 8px 12px; border: 1px dashed var(--brand-light); border-radius: 10px; background: #f4faf8; font-size: 14px; }
  .setup-box summary { cursor: pointer; font-weight: 700; color: var(--brand-dark); }
  /* الملاحظات: بطاقة لكل ملاحظة (المثبّتة بشريط ذهبي) ونصها بأسطره */
  .note-card { border-inline-start: 4px solid var(--brand-light); }
  .note-card.pinned { border-inline-start-color: var(--gold, #ad9e6e); background: #fffdf7; }
  .note-body { white-space: pre-wrap; margin: 10px 0 8px; line-height: 1.8; }
  /* معاينة قرار لجنة الشكاوى والصلح: القيم المولَّدة بالأحمر كما في نموذج القرار */
  .decision-preview { padding: 14px 16px; border: 1px solid var(--line); border-radius: 12px; background: #fff; line-height: 2; }
  .decision-preview .dv { color: #c00000; font-weight: 700; }
  .decision-preview .dp-title { text-align: center; font-weight: 800; font-size: 18px; text-decoration: underline; margin: 12px 0; }
  .decision-preview .dp-sign { display: flex; justify-content: space-between; margin-top: 40px; padding-top: 10px; border-top: 1px dashed var(--line); }
  .decision-preview p { text-align: justify; }
  /* «التغييرات»: سطر لكل تعديل، بخط أصغر وتمرير إن طالت */
  .changes-box { white-space: pre-wrap; font-size: 13.5px; line-height: 1.9; max-height: 260px; overflow-y: auto; padding: 8px 12px; border: 1px solid var(--line); border-radius: 10px; background: #faf8f4; }
  /* درجة سرية القرار (غير «عادي») */
  .badge.secrecy-tag { background: #fbe9e7; color: #a12d1f; }
  /* ربط المصادقة بين قرار الشكاوى وقرار الإدارة */
  .approval-box { margin-top: 12px; padding: 10px 12px; border-radius: 10px; border: 1px solid var(--line); background: #fff8e8; line-height: 1.9; }
  .approval-box.ok { background: #eaf6f2; border-color: #b9ded4; }
  /* علامة الرابط الخارجي في «روابط سريعة» بالقائمة الجانبية */
  .side-ext { margin-inline-start: auto; opacity: .6; font-size: 12px; }
  a.side-item { text-decoration: none; }
  /* حاوية بلا إطار لتعطيل خانات نموذج الجلسة (عرض المسؤول) */
  .plain-fieldset { border: 0; padding: 0; margin: 0; min-width: 0; }
  /* أيقونتا الملفات في سجل الشكاوى: الملوّنة رابط، والباهتة غير موجودة */
  .file-icons { display: inline-flex; gap: 8px; font-size: 18px; }
  .file-icons a { text-decoration: none; }
  .file-icons .off { opacity: .2; filter: grayscale(1); }
  .archive-sub { margin: 18px 0 8px; font-size: 16px; color: var(--brand-dark); border-top: 1px solid var(--line); padding-top: 14px; }

  /* المؤشرات: أدوات الفترة، بطاقات الأرقام، أشرطة أفقية بلون واحد (والحالات بألوانها)، وأعمدة الوارد يومياً */
  .ind-tools { margin-bottom: 14px; }
  .ind-tools select { width: auto; min-width: 150px; }
  .ind-kpis { display: grid; grid-template-columns: repeat(auto-fill, minmax(160px, 1fr)); gap: 12px; margin-bottom: 16px; }
  .ind-kpi { background: var(--card); border: 1px solid var(--line); border-radius: 14px; padding: 12px 14px; box-shadow: var(--shadow); border-top: 4px solid var(--brand); }
  .ind-kpi .label { color: var(--muted); font-size: 13px; font-weight: 700; }
  .ind-kpi .value { font-size: 28px; font-weight: 800; color: var(--ink); line-height: 1.25; font-variant-numeric: tabular-nums; }
  .ind-kpi.closed { border-top-color: var(--brand-light); }
  .ind-kpi.open { border-top-color: var(--gold); }
  .ind-kpi.hot { border-top-color: var(--danger); }
  .ind-kpi.hot .value { color: var(--danger); }
  .ind-kpi.warm { border-top-color: #e08a1e; }
  .ind-grid { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 14px; }
  .ind-grid .card { margin: 0; }
  .ind-grid .card h2 { font-size: 16px; }
  .ind-wide { grid-column: 1 / -1; }
  .bars { display: grid; gap: 8px; }
  .bar-row { display: grid; grid-template-columns: minmax(90px, 34%) 1fr auto; align-items: center; gap: 10px; font-size: 14px; }
  .bar-label { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .bar-track { height: 12px; background: #f0ece4; border-radius: 4px; overflow: hidden; }
  .bar-fill { display: block; height: 100%; background: var(--brand); border-radius: 4px; }
  .bar-fill[class*="st-"] { background: var(--st); }
  .bar-value { font-weight: 800; font-variant-numeric: tabular-nums; min-width: 64px; text-align: left; }
  .bar-value small { color: var(--muted); font-weight: 600; }
  .cols { display: flex; align-items: flex-end; gap: 3px; height: 140px; padding-top: 6px; border-bottom: 1px solid var(--line); }
  .col { flex: 1; height: 100%; display: flex; align-items: flex-end; }
  .col-fill { display: block; width: 100%; background: var(--brand-light); border-radius: 4px 4px 0 0; }
  .col-fill.zero { background: var(--line); }
  .col:hover .col-fill { background: var(--brand); }
  .cols-axis { display: flex; justify-content: space-between; color: var(--muted); font-size: 12px; margin-top: 6px; }
  @media (max-width: 760px) { .ind-grid { grid-template-columns: minmax(0, 1fr); } }

  /* دليل المنصة: تسلسل الحالات (شارات وأسهم تلتف على الجوال) */
  .flow { display: flex; flex-wrap: wrap; align-items: center; gap: 6px 8px; }
  .flow-step { display: inline-flex; flex-direction: column; align-items: center; color: var(--muted); line-height: 1.1; }
  .flow-step small { font-size: 11.5px; }
  .flow-label { margin: 12px 0 8px; font-weight: 700; color: #b8336a; font-size: 14px; }

  /* القرارات الإدارية: لوحة البحث المتقدم ووسم التصنيف */
  .adv-search { margin-bottom: 10px; background: #faf8f4; }
  .badge.dec-tag { background: #f3eedf; color: #7a6a3a; border: 1px solid var(--gold-light); }

  /* سطر الإحالات في تفاصيل الشكوى */
  .ref-line { margin-top: 10px; padding: 8px 12px; border-radius: 10px; background: var(--brand-soft); font-size: 14px; line-height: 1.9; }

  /* الشاشة الرئيسية للأدمن: ترحيب، بحث، وأزرار كبيرة بأعداد */
  .home-hello { font-size: 18px; font-weight: 800; margin: 4px 0 12px; }
  .home-search { margin-bottom: 14px; }
  .home-tiles { display: grid; grid-template-columns: repeat(auto-fill, minmax(150px, 1fr)); gap: 12px; }
  .home-tiles.small .tile { min-height: 96px; }
  .home-label { margin: 22px 0 8px; font-weight: 800; color: var(--muted); font-size: 14px; }
  .tile { position: relative; display: flex; flex-direction: column; align-items: flex-start; gap: 4px; min-height: 120px; padding: 16px;
          border: 1px solid var(--line); border-radius: 16px; background: var(--card); box-shadow: var(--shadow); cursor: pointer;
          font: inherit; text-align: start; color: var(--ink); transition: transform .08s; }
  .tile:active { transform: scale(.97); }
  .tile-icon { font-size: 30px; line-height: 1; }
  .tile-title { font-size: 16.5px; font-weight: 800; }
  .tile-sub { font-size: 13px; color: var(--muted); }
  .tile-count { position: absolute; top: 12px; inset-inline-end: 12px; min-width: 34px; padding: 2px 10px; border-radius: 999px;
                background: #eaf3f1; font-size: 18px; font-weight: 800; text-align: center; }
  .tile.hot { border-color: #f1b5b0; background: linear-gradient(180deg, #fff5f4, #fff); }
  .tile.hot .tile-count { background: var(--danger); color: #fff; }
  .tile.warm { border-color: #f3c99a; background: linear-gradient(180deg, #fff8ef, #fff); }
  .tile.warm .tile-count { background: #e08a1e; color: #fff; }
  .tile.ok .tile-count { background: #d4ece8; color: #00594f; }
  /* لوحة الإدارة: قائمة جانبية على اليمين + المحتوى؛ القائمة بلون الهوية الداكن، والعنصر النشط أبيض بشريط ذهبي */
  /* لوحة الإدارة بعرض الشاشة: القائمة ملتصقة بأقصى اليمين بطول الصفحة، والمحتوى بجانبها */
  .container.admin-wide { max-width: none; padding: 0; }
  .admin-shell { display: block; min-height: 100vh; }
  .admin-main { min-width: 0; margin-right: 260px; padding: 22px 22px calc(48px + env(safe-area-inset-bottom, 0px)); overflow-x: clip; }
  .side { position: fixed; top: 0; right: 0; bottom: 0; width: 260px; z-index: 40; overflow-y: auto; overscroll-behavior: contain;
          display: flex; flex-direction: column; scrollbar-width: thin; scrollbar-color: rgba(255,255,255,.35) transparent;
          background: linear-gradient(180deg, var(--brand-dark), #00463e); color: #fff;
          border-radius: 0 0 0 18px; padding: 16px 10px; box-shadow: -2px 0 18px rgba(0, 89, 79, .18); }
  .side::-webkit-scrollbar { width: 8px; }
  .side::-webkit-scrollbar-thumb { background: rgba(255,255,255,.3); border-radius: 8px; }
  .side-head { display: flex; align-items: center; gap: 10px; padding: 4px 8px 14px; margin-bottom: 8px; border-bottom: 1px solid rgba(255,255,255,.14); }
  .side-who { flex: 1; min-width: 0; line-height: 1.3; }
  .side-who b { display: block; font-size: 15.5px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .side-who small { color: var(--gold-light); font-size: 12.5px; }
  .side-close { display: none; border: 0; background: rgba(255,255,255,.1); color: #fff; width: 36px; height: 36px; border-radius: 10px; font-size: 16px; cursor: pointer; }
  .side-nav { display: grid; gap: 3px; }
  .side-item { display: flex; align-items: center; gap: 10px; width: 100%; min-height: 46px; padding: 8px 12px; border: 0; border-radius: 12px;
               background: transparent; color: #e3efec; font: inherit; font-size: 15px; font-weight: 700; cursor: pointer; text-align: start;
               transition: background .15s, color .15s; }
  .side-item:hover { background: rgba(255,255,255,.09); color: #fff; }
  .side-item.active { background: #fff; color: var(--brand-dark); box-shadow: inset -4px 0 0 var(--gold); }
  .side-icon { font-size: 19px; width: 26px; text-align: center; }
  .side-label { flex: 1; }
  .side-count { min-width: 26px; padding: 1px 8px; border-radius: 999px; background: rgba(255,255,255,.2); color: #fff; font-size: 13px; text-align: center; }
  .side-count.hot { background: var(--danger); }
  .side-item.active .side-count { background: var(--brand-soft); color: var(--brand-dark); }
  .side-item.active .side-count.hot { background: var(--danger); color: #fff; }
  .side-group { margin: 16px 12px 6px; font-size: 12.5px; font-weight: 800; color: var(--gold-light); }
  /* أسفل القائمة: اسم المستخدم ودوره */
  .side-user { margin-top: auto; display: flex; align-items: center; gap: 10px; padding: 14px 10px 4px; border-top: 1px solid rgba(255,255,255,.14); }
  .side-avatar { width: 40px; height: 40px; border-radius: 50%; display: grid; place-items: center; background: rgba(255,255,255,.12); font-size: 20px; flex-shrink: 0; }
  /* شريط أعلى المحتوى: زر القائمة (جوال)، عنوان القسم، ثم دليل المنصة وخروج */
  .admin-top { position: sticky; top: 0; z-index: 30; display: flex; align-items: center; gap: 10px; margin: -22px -22px 18px; padding: 12px 22px;
               background: rgba(245, 241, 234, .94); backdrop-filter: blur(6px); border-bottom: 1px solid var(--line); }
  .admin-title { margin: 0; font-size: 19px; color: var(--brand-dark); flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .admin-top-actions { display: flex; gap: 8px; flex-shrink: 0; }
  .btn.is-on { background: var(--brand-soft); border-color: var(--brand-light); color: var(--brand-dark); }
  .menu-btn { display: none; font-size: 20px; min-width: 46px; }
  .side-backdrop { display: none; }
  .home-hint { font-size: 13.5px; margin-top: 16px; }
  .only-phone { display: none; }
  /* الجوال والشاشات الصغيرة: القائمة تنزلق من اليمين فوق خلفية معتمة، وتُفتح بزر ☰ */
  @media (max-width: 899px) {
    .admin-shell { display: block; min-height: 0; }
    .admin-main { margin-right: 0; padding: 18px 16px calc(48px + env(safe-area-inset-bottom, 0px)); }
    .admin-top { margin: -18px -16px 14px; padding: 10px 16px; }
    .admin-title { font-size: 17px; }
    .side { position: fixed; top: 0; bottom: 0; right: 0; height: auto; width: min(290px, 84vw); z-index: 70; overflow-y: auto; border-radius: 18px 0 0 18px;
            padding-top: calc(14px + env(safe-area-inset-top, 0px)); transform: translateX(105%); visibility: hidden;
            transition: transform .24s ease, visibility .24s; }
    .side.open { transform: none; visibility: visible; }
    .side-close { display: inline-block; }
    .side-backdrop { display: block; position: fixed; inset: 0; background: rgba(0, 0, 0, .38); z-index: 65; }
    .menu-btn { display: inline-flex; }
    .only-phone { display: inline; }
  }
  @media (max-width: 480px) { .hide-xs { display: none; } }

  /* بطاقة الشكوى: أزرار الرأس، شبكة المعلومات الأساسية، وتبويبات بعدها */
  .c-head-actions { display: flex; align-items: center; gap: 8px; flex-shrink: 0; }
  .info-grid { margin: 12px 0 4px; padding: 12px 14px; background: #faf8f4; border: 1px solid var(--line); border-radius: 12px; }
  .card-tabs { margin: 16px 0 12px; position: sticky; top: 0; z-index: 2; }
  .card-pane { animation: fadeIn .15s ease; }
  @keyframes fadeIn { from { opacity: .4; } to { opacity: 1; } }

  /* الرئيسية: شريط ترحيب بلون الهوية، البطاقات، ثم ثلاث قوائم قصيرة جنباً إلى جنب */
  .home-hero { display: flex; flex-wrap: wrap; align-items: center; justify-content: space-between; gap: 14px 24px; padding: 20px 22px; margin-bottom: 16px;
               border-radius: 18px; color: #fff; background: linear-gradient(120deg, var(--brand-dark), var(--brand) 60%, var(--brand-light)); box-shadow: 0 8px 24px rgba(0, 89, 79, .18); }
  .home-hero .home-hello { margin: 0; font-size: 21px; }
  .home-date { color: var(--gold-light); font-size: 14px; margin-top: 4px; }
  .home-hero .home-search { margin: 0; flex: 1 1 320px; max-width: 560px; }
  .home-hero .home-search input { border-color: transparent; }
  .home .home-tiles { grid-template-columns: repeat(4, minmax(0, 1fr)); }
  .home-grid { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 14px; margin-top: 14px; }
  .home-grid .card { margin: 0; }
  .home-list-head { display: flex; align-items: center; justify-content: space-between; gap: 8px; margin-bottom: 6px; }
  .home-list-head h2 { margin: 0; font-size: 16px; }
  .home-list ul { list-style: none; margin: 0; padding: 0; }
  .home-list li { display: flex; align-items: center; gap: 10px; padding: 9px 6px; border-bottom: 1px solid var(--line); cursor: pointer; border-radius: 8px; font-size: 14px; }
  .home-list li:last-child { border-bottom: 0; }
  .home-list li:hover { background: #f5f1ea; }
  .home-list li .grow { flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  @media (max-width: 1100px) { .home-grid { grid-template-columns: repeat(2, minmax(0, 1fr)); } }
  @media (max-width: 760px) { .home .home-tiles { grid-template-columns: repeat(2, minmax(0, 1fr)); } .home-grid { grid-template-columns: minmax(0, 1fr); } .home-hero { padding: 16px; } }
  .home-grid > *, .home-tiles > *, .ind-grid > * { min-width: 0; }

  /* شريط أعلى القسم المفتوح: زر الرئيسية وعنوان القسم */
  .section-bar { display: flex; align-items: center; gap: 12px; margin-bottom: 14px; }
  .section-bar h2 { margin: 0; font-size: 19px; }

  /* سطر اختيار الموسم فوق جدول الشكاوى */
  .season-row { margin-bottom: 10px; align-items: center; }
  .season-row select { width: auto; min-width: 170px; }

  /* تبويب الروابط: مربع الرسالة الجاهزة (أخضر فاتح)، والرابط الطويل يلتف بدل أن يوسّع الصفحة */
  .ready-msg { background: #eef7f5; border: 2px solid #93cfc6; }
  .ready-msg textarea { width: 100%; font-size: 16px; direction: rtl; resize: vertical; }
  .link-url { font-size: 13px; overflow-wrap: anywhere; text-align: left; }
  .danger-zone ul { margin: 0 0 12px; padding-inline-start: 20px; line-height: 1.9; }
  .btn.danger { background: var(--danger); border-color: var(--danger); color: #fff; }
  .btn.danger:disabled { opacity: .5; cursor: not-allowed; }

  /* مربع «حدّد موعد التنبيه القادم» عند فتح الشكوى من «المطلوب» */
  .due-prompt { background: #fff4e6; border: 2px solid #f3c99a; border-radius: 12px; padding: 12px; margin-bottom: 14px; }
  .due-prompt.closed { background: #e4f2ef; border-color: #93cfc6; }
  .due-prompt .grid .btn { white-space: normal; }

  /* عنوان الاعتراض في نافذة الشكوى */
  .c-title { font-weight: 800; font-size: 16px; margin-top: 10px; }

  /* زر التسجيل الصوتي أثناء الاستماع: أحمر نابض */
  .btn.danger-mic { background: var(--danger); animation: pulse 1.2s ease-in-out infinite; }
  @keyframes pulse { 50% { opacity: .7; } }

  /* مهلة الاعتراض: أخضر فاتح، وأحمر عند انتهائها */
  .deadline { background: var(--ok-soft); color: var(--ok); border-radius: 9px; padding: 7px 12px; margin-bottom: 10px; font-size: 14px; }
  .deadline.over { background: var(--danger-soft); color: var(--danger); }

  /* سجل الشكوى: خط زمني (الإحالة بلون أزرق، الحالة بلون بنفسجي) */
  .timeline { list-style: none; margin: 0; padding: 0 14px 0 0; border-inline-start: 2px solid var(--line); }
  .timeline li { position: relative; padding: 0 16px 14px 0; }
  .timeline li::before { content: ""; position: absolute; inset-inline-start: -7px; top: 6px; width: 12px; height: 12px; border-radius: 50%; background: #c4bba6; border: 2px solid #fff; }
  .timeline li.ref::before { background: #1d5fbf; }
  .timeline li.st::before { background: #7a3fb8; }
  .timeline .t-head { font-size: 14.5px; }
  .timeline .t-body { font-size: 14px; margin-top: 2px; overflow-wrap: anywhere; }
  .timeline .t-body .old { color: var(--muted); text-decoration: line-through; }
  .timeline .t-note { font-size: 13.5px; background: #f9f7f2; border-radius: 6px; padding: 4px 8px; margin-top: 4px; overflow-wrap: anywhere; }
  .timeline .t-by { font-size: 12.5px; margin-top: 2px; }

  /* وضع دخول المشتكين: بطاقات اختيار */
  .modes { display: grid; grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); gap: 10px; }
  .mode { border: 2px solid var(--line); border-radius: 12px; padding: 12px 14px; cursor: pointer; background: #fff; text-align: start; }
  .mode b { display: block; font-size: 16px; }
  .mode span { color: var(--muted); font-size: 13.5px; }
  .mode.active { border-color: var(--brand); background: var(--brand-soft); }

  /* مفتاح تشغيل/إيقاف (زر التقديم المباشر) */
  .switch-row { display: flex; align-items: center; gap: 12px; padding: 12px 14px; border: 2px solid var(--line); border-radius: 12px; cursor: pointer; background: #fff; }
  .switch-row.on { border-color: var(--brand); background: var(--brand-soft); }
  .switch-row input { position: absolute; opacity: 0; width: 1px; height: 1px; }
  .switch { flex: none; width: 48px; height: 28px; border-radius: 999px; background: #d2cab9; position: relative; transition: background .15s; }
  .switch::after { content: ""; position: absolute; top: 3px; inset-inline-start: 3px; width: 22px; height: 22px; border-radius: 50%; background: #fff; box-shadow: 0 1px 3px rgba(0,0,0,.25); transition: inset-inline-start .15s; }
  .switch-row.on .switch { background: var(--brand); }
  .switch-row.on .switch::after { inset-inline-start: 23px; }
  .switch-row input:focus-visible + .switch { box-shadow: 0 0 0 3px rgba(14,107,79,.3); }

  /* رمز جديد يظهر بخط كبير */
  .big-code { text-align: center; font-size: 34px; font-weight: 800; letter-spacing: 4px; direction: ltr; color: var(--brand-dark); background: #eef7f5; border: 2px dashed #a9d6cf; border-radius: 12px; padding: 10px; margin: 8px 0 12px; user-select: all; }

  /* القوائم البسيطة (كلمات المرور) */
  .list { list-style: none; margin: 0; padding: 0; }
  .list li { display: flex; justify-content: space-between; align-items: center; gap: 10px; padding: 10px 0; border-bottom: 1px solid var(--line); }
  .list li:last-child { border-bottom: 0; }
  .mono { direction: ltr; font-weight: 800; letter-spacing: 2px; font-family: ui-monospace, Consolas, monospace; }

  /* التقارير: بطاقات الأعداد والفلتر */
  .kpis { display: grid; grid-template-columns: repeat(3, 1fr); gap: 12px; margin-bottom: 16px; }
  .kpi { background: var(--card); border: 1px solid var(--line); border-radius: var(--radius); padding: 14px; box-shadow: var(--shadow); border-top: 4px solid var(--brand); text-align: center; }
  .kpi .label { color: var(--muted); font-size: 13.5px; font-weight: 600; }
  .kpi .value { font-size: 32px; font-weight: 800; line-height: 1.2; font-variant-numeric: tabular-nums; }
  .kpi.closed { border-top-color: #006e5c; background: #e4f2ef; } .kpi.closed .value { color: #006e5c; }
  .kpi.open { border-top-color: #1d5fbf; background: #eaf2fd; } .kpi.open .value { color: #1d5fbf; }
  .filters { display: flex; gap: 10px; align-items: flex-end; flex-wrap: wrap; }
  .filters .field { flex: 1 1 140px; }

  /* أدوات عامة */
  .muted { color: var(--muted); }
  .center { text-align: center; }
  .empty { text-align: center; color: var(--muted); padding: 30px 10px; }
  .spinner { width: 26px; height: 26px; border: 3px solid #ddd6c8; border-top-color: var(--brand); border-radius: 50%; animation: spin .8s linear infinite; margin: 50px auto; }
  @keyframes spin { to { transform: rotate(360deg); } }
  code { background: #eee9df; padding: 1px 6px; border-radius: 5px; direction: ltr; display: inline-block; }

  /* الجوال (أقل من 640px): مسافات أصغر وحقول بعمود واحد؛ جدول التقارير يتحول إلى بطاقات
     (جدول الشكاوى في الأدمن يبقى جدولاً داخل إطار قابل للتمرير مثل Excel) */
  @media (max-width: 640px) {
    .container { padding-top: 16px; }
    .card { padding: 16px; }
    .page-head h1, .hero h1 { font-size: 20px; }
    .grid { grid-template-columns: 1fr; }
    .brand { font-size: 15px; }
    .brand small { display: none; }
